# Single source of truth for versions. Libraries managed by the Spring Boot BOM have no version here.
[versions]
spring-boot = "4.1.1"
spring-modulith = "2.1.1"
springdoc = "3.1.1"
json-schema-validator = "3.0.8"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }

# Versions from the Spring Boot BOM
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
kafka-clients = { module = "org.apache.kafka:kafka-clients" }
kafka-streams = { module = "org.apache.kafka:kafka-streams" }
kafka-streams-test-utils = { module = "org.apache.kafka:kafka-streams-test-utils" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }
