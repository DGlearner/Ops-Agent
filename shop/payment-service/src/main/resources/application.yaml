spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://localhost:3306/shop_payment
    username: payment_svc
    password: payment-dev
    hikari:
      data-source-properties:
        # Sessions run in UTC whatever the JVM time zone is, so NOW(3) and DATETIME values are always UTC.
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true

server:
  port: 8093

management:
  server:
    port: 8193

shop:
  payment:
    # Simulated time spent at the payment provider, picked uniformly per charge.
    gateway-latency-min: 20ms
    gateway-latency-max: 60ms
    # A charge still PROCESSING after this long was interrupted (e.g. a crash) and is settled by asking the provider.
    stale-after: 30s
