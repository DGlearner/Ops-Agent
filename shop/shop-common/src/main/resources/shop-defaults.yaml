# Defaults shared by every shop service, added with the lowest precedence by ShopDefaultsEnvironmentPostProcessor.
# A service's own application.yaml (or any other property source) overrides any of these.
spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    hikari:
      # Fail within 2 s when the pool is exhausted or MySQL is down, instead of holding the request for 30 s.
      connection-timeout: 2000 # ms
      # A transaction waiting on a row lock gives up after 5 s instead of MySQL's default 50 s.
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 5
  flyway:
    # Flyway opens the first connection, with the same 2 s timeout, which a busy machine (several services starting at
    # once) can miss; retry for about 30 s (1, 2, 4, 8, 16 s apart) instead of exiting.
    connect-retries: 5

server:
  # The shop has no authentication, so its business ports, like the management ports, are reachable from this machine
  # only (docs/shop-design.md §3). To reach a service from elsewhere set server.address (SERVER_ADDRESS), e.g. 0.0.0.0.
  address: 127.0.0.1
  tomcat:
    # Publishes tomcat.threads.busy / current / config.max: request threads running out is a failure to detect.
    mbeanregistry:
      enabled: true

# Console output stays human-readable; the file gets one ECS JSON object per line for log collectors.
logging:
  file:
    # Gradle bootRun points shop.log-dir at <repo>/logs/shop so collectors find every service in one place.
    name: ${shop.log-dir:logs}/${spring.application.name}.log
  structured:
    format:
      file: ecs
    json:
      # ECS field names (as dotted keys, like Elastic's own loggers) for the ids Micrometer Tracing puts in the MDC.
      rename:
        traceId: trace.id
        spanId: span.id
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 3

management:
  server:
    # Each service sets its own management port; Actuator (metrics, health and fault injection) is reachable from
    # this machine only.
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,faults
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    # Every request gets a trace id for log correlation; no exporter is configured, so this costs nothing extra.
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}
