spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:mysql://localhost:3306/shop_inventory
    username: inventory_svc
    password: inventory-dev
    hikari:
      data-source-properties:
        # Sessions run in UTC whatever the JVM time zone is, so NOW(3) and DATETIME values are always UTC.
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true

server:
  port: 8092

management:
  server:
    port: 8192
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,faults,rowlock,stockprep
