# MySQL and Redis for the shop target system (docs/shop-design.md).
#
#   docker compose up -d
#
# Kept apart from Ops-Agent's own infrastructure (deploy/compose) so that faults injected into the shop never affect
# the monitoring system. The ports bind to 127.0.0.1 only; see .env.example to change them.

name: ops-shop

services:
  mysql:
    image: mysql:8.4.10
    ports:
      - "127.0.0.1:${SHOP_MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${SHOP_MYSQL_ROOT_PASSWORD:-shop-root-dev}
    # Performance Schema costs ~200 MB; drop this flag when diagnosing with performance_schema or sys views.
    command: ["mysqld", "--performance-schema=OFF"]
    mem_limit: 640m
    # One core, so load experiments run on fixed resources and MySQL cannot starve the services on a shared machine.
    cpus: 1.0
    volumes:
      - mysql-data:/var/lib/mysql
      # Runs once, on the first start with an empty data volume: one database and one account per service.
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Flash sales (§16): who may buy, and the queue of accepted orders.
  redis:
    image: redis:8.8.3-alpine
    ports:
      - "127.0.0.1:${SHOP_REDIS_PORT:-6380}:6379"
    # The queue holds orders already promised to buyers, so it is persisted (AOF, fsync every second: a crash loses at
    # most the last second), and nothing may be evicted.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec",
              "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 256m
    # Half a core, so load experiments run on fixed resources (§11.5).
    cpus: 0.5
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
