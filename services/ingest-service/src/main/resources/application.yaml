spring:
  application:
    name: ingest-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
        compression.type: lz4
        # Fail fast so clients get a 503 they can retry instead of a hanging request.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 1s

server:
  port: 8081
  # The local profile accepts the published development key, so by default only this machine can reach it. A deployment
  # that receives logs from other hosts sets server.address (SERVER_ADDRESS) together with its own ops.ingest.sources.
  address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

ops:
  ingest:
    max-request-size: 1MB
    publish-timeout: 10s
    rate-limit:
      enabled: true
      capacity: 20000
      refill-per-second: 5000
    # Log sources and the SHA-256 of their API keys: none outside the local profile, so a shared or deployed
    # environment must configure its own (ops.ingest.sources[0].id, ...), or the service does not start.

---
# Local development only: the default profile when none is set (spring.profiles.default above).
spring:
  config:
    activate:
      on-profile: local
ops:
  ingest:
    sources:
      # The API key is "dev-ingest-key"; only its SHA-256 is configured. Refused outside the local profile.
      - id: dev
        api-key-sha256: 21dd9e3b3f1633b88d69b73906f1a9e594beebd9b616bf89448c0a50a8b4ad10
