[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-agent"
version = "0.1.0"
description = "Ops-Agent's agent runtime: explains incidents using core-service's read-only API"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jsonschema>=4.21",
    "confluent-kafka>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ops-agent = "ops_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
